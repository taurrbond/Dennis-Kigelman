<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dennis Kigelman</title>
<meta name="description" content="Dennis Kigelman — personal website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e6e4df;
    --accent: #2f5d50;
    --accent-soft: #e8efec;
    --radius: 14px;
    --max: 1040px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121413;
      --surface: #1a1d1c;
      --text: #ecebe7;
      --muted: #9a9a96;
      --line: #2a2e2c;
      --accent: #7fb8a6;
      --accent-soft: #1f2a27;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Rubik", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-weight: 400;
  }
  a { color: inherit; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
  .logo { font-weight: 700; letter-spacing: .02em; text-decoration: none; }
  .links { display: flex; gap: 24px; }
  .links a { text-decoration: none; color: var(--muted); font-size: .95rem; }
  .links a:hover { color: var(--text); }
  .lang { display: flex; gap: 4px; }
  .lang button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; font-size: .8rem; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .lang button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  @media (max-width: 720px) { .links { display: none; } }

  /* Sections */
  section { padding: 88px 0; border-bottom: 1px solid var(--line); }
  .eyebrow { color: var(--accent); font-size: .85rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.1; font-weight: 700; margin-bottom: 20px; }
  h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; font-weight: 500; margin-bottom: 32px; }
  h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 8px; }
  .lead { font-size: 1.15rem; color: var(--muted); max-width: 620px; }

  /* Hero */
  .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: center; }
  .photo {
    aspect-ratio: 4/5; border-radius: var(--radius); background: var(--accent-soft);
    display: grid; place-items: center; color: var(--accent); font-size: 4rem; font-weight: 300;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none;
    font-weight: 500; border: 1px solid var(--text);
  }
  .btn.primary { background: var(--text); color: var(--bg); }
  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; }
    .photo { max-width: 260px; }
  }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; }
  .card p { color: var(--muted); font-size: .95rem; }
  .num { color: var(--accent); font-weight: 500; font-size: .85rem; margin-bottom: 12px; display: block; }

  /* About */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .about p + p { margin-top: 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-content: start; }
  .stat strong { display: block; font-size: 2.2rem; font-weight: 500; color: var(--accent); }
  .stat span { color: var(--muted); font-size: .9rem; }
  @media (max-width: 720px) { .about { grid-template-columns: 1fr; } }

  /* Timeline */
  .timeline { list-style: none; }
  .timeline li { display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 20px 0; border-top: 1px solid var(--line); }
  .timeline .year { color: var(--muted); font-size: .9rem; }
  .timeline p { color: var(--muted); font-size: .95rem; }
  @media (max-width: 560px) { .timeline li { grid-template-columns: 1fr; gap: 4px; } }

  /* Quotes */
  blockquote { font-size: 1.05rem; }
  blockquote footer { margin-top: 16px; color: var(--muted); font-size: .9rem; }

  /* Contact */
  .contact { text-align: center; }
  .contact .lead { margin: 0 auto; }
  .contact .actions { justify-content: center; }
  footer.site { padding: 32px 0; color: var(--muted); font-size: .85rem; text-align: center; }

  /* Placeholder marker — remove once real content is in */
  .ph { background: #fff4c2; color: #6b5300; border-radius: 4px; padding: 0 4px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ph { background: #4a3f12; color: #ffe58a; } }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#top" class="logo">Dennis Kigelman</a>
    <nav class="links">
      <a href="#about" data-i18n="nav_about"></a>

      <a href="#experience" data-i18n="nav_experience"></a>

    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="he">עב</button>
      <button data-lang="ru">RU</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <!-- Hero -->

      <!-- Replace with <img src="photo.jpg" alt="Dennis Kigelman" class="photo"> -->
      <div class="photo" aria-hidden="true">DK</div>

  </section>

  <!-- About -->
  <section id="about">
    <div class="wrap">
      <p class="eyebrow" data-i18n="nav_about"></p>
      <div class="about">
        <div>

          <p data-i18n="about_p2"></p>
        </div>
        <div class="stats">
          <div class="card stat"><strong data-i18n="area_v"></strong><span data-i18n="area_l"></span></div>
          <div class="card stat"><strong>[3]</strong><span data-i18n="stat_langs"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Services -->
  <section id="services">
    <div class="wrap">
      <p class="eyebrow" data-i18n="nav_services"></p>
      <h2 data-i18n="services_title"></h2>
      <div class="grid">
        <div class="card"><span class="num">01</span><h3 data-i18n="s1_t"></h3><p data-i18n="s1_d"></p></div>
        <div class="card"><span class="num">02</span><h3 data-i18n="s2_t"></h3><p data-i18n="s2_d"></p></div>
        <div class="card"><span class="num">03</span><h3 data-i18n="s3_t"></h3><p data-i18n="s3_d"></p></div>
      </div>
    </div>
  </section>

  <!-- Experience -->
  <section id="experience">
    <div class="wrap">
      <p class="eyebrow" data-i18n="nav_experience"></p>
      <h2 data-i18n="exp_title"></h2>
      <ul class="timeline">
        <li><span class="year">[2020 — ]</span><div><h3 data-i18n="e1_t"></h3><p data-i18n="e1_d"></p></div></li>
        <li><span class="year">[—]</span><div><h3 data-i18n="e2_t"></h3><p data-i18n="e2_d"></p></div></li>
      </ul>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="contact">
    <div class="wrap">
      <p class="eyebrow" data-i18n="nav_contact"></p>
      <h2 data-i18n="contact_title"></h2>
      <p class="lead" data-i18n="contact_lead"></p>
      <div class="actions">
        <a href="https://wa.me/972000000000" class="btn primary">WhatsApp</a>
        <a href="mailto:email@example.com" class="btn">Email</a>
        <a href="tel:+972000000000" class="btn" data-i18n="cta_call"></a>
      </div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">© <span id="year"></span> Dennis Kigelman</div>
</footer>

<script>
  // Text in [square brackets] is placeholder — replace with real content.
  const T = {
    he: {

      contact_title: "בואו נדבר",
      contact_lead: "זמין בטלפון, בוואטסאפ ובמייל."
    },
    ru: {
      nav_about: "Обо мне", nav_services: "Услуги", nav_experience: "Квалификация", nav_contact: "Контакты",
      hero_role: "Охрана и безопасность · центр страны и поездки",
      hero_title: "Деннис Кигельман",
      hero_lead: "Профессиональный охранник в центре Израиля и сопровождение поездок — чтобы вы и ваша группа были спокойны.",
      cta_contact: "Связаться", cta_services: "Мои услуги", cta_call: "Позвонить",

      about_p2: "[Что для меня важно в работе: например — доступность, пунктуальность, знание местности.]",
      area_v: "Центр", area_l: "район работы + поездки по всей стране", stat_langs: "языка: иврит, русский, английский",

    },
    en: {
      nav_about: "About", nav_services: "Services", nav_experience: "Qualifications", nav_contact: "Contact",
      hero_role: "Security · Central Israel & trips",
      hero_title: "Dennis Kigelman",
      hero_lead: "Professional security guard in Central Israel and trip security — so you and your group can feel safe.",
      cta_contact: "Get in touch", cta_services: "My services", cta_call: "Call",
      about_title: "Reliable, responsible, alert",
      about_p1: "[How many years in the field and where I've worked.]",
      about_p2: "[What matters to me: e.g. availability, punctuality, knowing the area.]",

      s1_t: "Security in Central Israel", s1_d: "Guarding sites and buildings in the central region.",
      s2_t: "Trip security", s2_d: "Escort and security for groups and trips, on the road and on site.",
      s3_t: "[Another service? E.g. event security]", s3_d: "[Short description, or remove.]",
      exp_title: "Qualifications & experience",
      e1_t: "[Role · Security company]", e1_d: "[What the role involves.]",

      contact_title: "Let's talk",
      contact_lead: "Available by phone, WhatsApp and email."
    }
  };

  // Wrap [placeholder] fragments so they stand out until replaced.
  const mark = s => s.replace(/\[[^\]]*\]/g, m => `<span class="ph">${m}</span>`);

  function setLang(lang) {
    const dict = T[lang] || T.he;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const v = dict[el.dataset.i18n];
      if (v !== undefined) el.innerHTML = mark(v);
    });
    document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  document.getElementById("year").textContent = new Date().getFullYear();

  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(saved || "he");
</script>
</body>
</html>
